name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    env:
      SKIP_FLASH_ATTN: "1"  # CI has no GPU; skip flash-attn build to avoid 5–25 min hang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest editdistance
      - run: pip install -e .
      - run: pytest tests/ -v --ignore=tests/test_metrics.py -k "not torch"
        # test_metrics.py requires torch/transformers — skip in CI (no GPU)
        # address_extractor and constants tests run fine without heavy deps
