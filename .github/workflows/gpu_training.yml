# gpu_training.yml — Automated GPU training, AI diagnosis, and Copilot auto-fix.
#
# What this workflow does:
#   1. Runs on a self-hosted GPU runner (provisioned by vastai_runner.sh).
#   2. Installs dependencies and runs `python run_all.py --micro --verify`
#      (~10 min), streaming output to training.log.
#   3. On failure: runs `python diagnostics.py --smoke-test --ai-diagnose` and
#      creates a GitHub Issue with the log tail, assigned to @copilot so the
#      Copilot coding agent can auto-fix it.
#   4. On success: commits result files back to the branch and resets the
#      auto-fix iteration counter.
#   5. Always: uploads results/ and training.log as workflow artifacts.
#
# Required secrets:
#   VASTAI_API_KEY     — Vast.ai API key (used by vastai_runner.sh)
#   ANTHROPIC_API_KEY  — Claude API key for AI diagnosis (or use MISTRAL_API_KEY)
#   MISTRAL_API_KEY    — Mistral API key (fallback when ANTHROPIC_API_KEY absent)
#   GITHUB_TOKEN       — Default Actions token (already available)
#
# Trigger manually:
#   gh workflow run gpu_training.yml -f training_mode=micro
#
# training_mode input values:
#   instant   — TrOCR+YOLO only, <30s after warm cache
#   superfast — TrOCR+YOLO only, <5 min
#   micro     — DONUT+YOLO+TrOCR smoke test, ~10 min  (default)
#   mini      — 1 DONUT exp + TrOCR+YOLO, ~20 min
#   (empty)   — Full 8-experiment suite, ~10 h

name: GPU Training

on:
  workflow_dispatch:
    inputs:
      training_mode:
        description: "Training mode (instant/superfast/micro/mini or empty for full run)"
        required: false
        default: "micro"
        type: choice
        options:
          - micro
          - mini
          - superfast
          - instant
          - ""
  push:
    branches:
      - main
    paths:
      - "**.py"
      - "experiments/**"
      - "requirements.txt"

jobs:
  train:
    name: GPU Training (${{ github.event.inputs.training_mode || 'micro' }})
    # Runs on a self-hosted GPU runner registered by vastai_runner.sh.
    # The runner registers itself with labels: self-hosted, gpu, vast-ai
    runs-on: [self-hosted, gpu]

    permissions:
      contents: write   # push result commits back to branch
      issues: write     # create failure issues assigned to @copilot

    env:
      GITHUB_REPO: ${{ github.repository }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

    steps:
      # -----------------------------------------------------------------------
      # 0. Checkout
      #    actions/checkout@v5 handles safe.directory automatically via its
      #    set-safe-directory: true default. The remote setup script in
      #    vastai_runner.sh also runs `git config --system --add safe.directory '*'`
      #    as root before dropping privileges to user `runner`, so no separate
      #    git config step is needed here.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # 1. Read auto-fix iteration state
      # -----------------------------------------------------------------------
      - name: Read auto-fix iteration state
        id: state
        run: |
          STATE_FILE=".github/auto_fix_state.json"
          if [[ -f "$STATE_FILE" ]]; then
            ITER=$(python3 -c "import json; d=json.load(open('$STATE_FILE')); print(d.get('iteration', 0))")
            MAX=$(python3 -c "import json; d=json.load(open('$STATE_FILE')); print(d.get('max_iterations', 5))")
          else
            ITER=0
            MAX=5
          fi
          echo "iteration=$ITER" >> "$GITHUB_OUTPUT"
          echo "max_iterations=$MAX" >> "$GITHUB_OUTPUT"
          echo "Auto-fix iteration: $ITER / $MAX"

      # -----------------------------------------------------------------------
      # 2. Set up Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------------
      # 3. Install dependencies
      #
      # requirements.txt is now safe for a flat `pip install -r` — flash-attn
      # has been moved to requirements-gpu-optional.txt.  We still install
      # PyTorch first from the CUDA index to get GPU-enabled wheels.
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: |
          pip install --upgrade pip

          # Stage 1: Install PyTorch + torchvision from the CUDA 12.1 index
          # to get GPU-enabled wheels (CPU-only runners get CPU wheels silently).
          TORCH_SPEC="$(grep -m1 '^torch>=' requirements.txt || echo 'torch>=2.0.0')"
          TV_SPEC="$(grep -m1 '^torchvision>=' requirements.txt || echo 'torchvision>=0.15.0')"
          pip install "$TORCH_SPEC" "$TV_SPEC" \
              --index-url https://download.pytorch.org/whl/cu121

          # Stage 2: Install remaining deps.  flash-attn is NOT in
          # requirements.txt, so this is safe as a flat install.
          pip install -r requirements.txt

          # Stage 3 (optional / best-effort): Install flash-attn from the
          # separate optional file.  --no-build-isolation lets its setup.py
          # import the already-installed torch.  Failure is non-fatal — the
          # pipeline falls back to PyTorch SDPA.
          if pip install -r requirements-gpu-optional.txt --no-build-isolation; then
              echo "flash-attn installed successfully."
          else
              echo "WARNING: flash-attn could not be installed (non-fatal). Pipeline will use PyTorch SDPA fallback."
          fi

          # Ensure linting tools are always available
          pip install ruff pyyaml

      # -----------------------------------------------------------------------
      # 4. Validate import chain before training
      # -----------------------------------------------------------------------
      - name: Validate import chain
        run: |
          python -c "from constants import FIELDS, BASE_MODEL, SEED"
          echo "Import chain OK"

      # -----------------------------------------------------------------------
      # 5. Write AI API keys to files (used by diagnostics.py)
      # -----------------------------------------------------------------------
      - name: Write AI API key files
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s\n' "$ANTHROPIC_API_KEY" > anthropic_api_key.txt
          fi
          if [ -n "$MISTRAL_API_KEY" ]; then
            printf '%s\n' "$MISTRAL_API_KEY" > mistral_api_key.txt
          fi

      # -----------------------------------------------------------------------
      # 6. Run training (continue-on-error so later steps always run)
      # -----------------------------------------------------------------------
      - name: Run training
        id: train
        continue-on-error: true
        run: |
          MODE="${{ github.event.inputs.training_mode || 'micro' }}"
          FLAG=""
          case "$MODE" in
            instant)   FLAG="--instant" ;;
            superfast) FLAG="--superfast" ;;
            micro)     FLAG="--micro" ;;
            mini)      FLAG="--mini" ;;
            "")        FLAG="" ;;
          esac

          echo "Training mode: ${MODE} (flag: ${FLAG:-none})"
          python run_all.py $FLAG --verify 2>&1 | tee training.log
          # Preserve exit code from run_all.py (not tee)
          exit "${PIPESTATUS[0]}"

      # -----------------------------------------------------------------------
      # 7. AI diagnosis on failure
      # -----------------------------------------------------------------------
      - name: AI diagnosis (on failure)
        if: steps.train.outcome == 'failure'
        run: |
          python diagnostics.py \
            --smoke-test \
            --ai-diagnose \
            --ai-provider auto \
            --github-notify \
            --github-repo "$GITHUB_REPO" \
            2>&1 | tee -a training.log || true

      # -----------------------------------------------------------------------
      # 7.5 Local auto-fix attempt (fast-path before Copilot)
      #
      # Runs autonomous_ci.py directly on the GPU runner with up to 3 quick
      # attempts.  If a fix is found, it is committed and pushed to main —
      # the next gpu_training.yml trigger will re-run training with the fix.
      # This is much faster than waiting for Copilot (~seconds vs ~minutes).
      # -----------------------------------------------------------------------
      - name: Local auto-fix attempt (fast-path)
        id: local_fix
        if: steps.train.outcome == 'failure'
        continue-on-error: true
        run: |
          echo "=== Attempting local auto-fix (up to 3 attempts) ==="
          # --skip-smoke-test: smoke test requires torch/transformers model loading
          # which is slow and may itself be the failure.  The auto-fix targets lint
          # and import errors that are quickly verifiable without a forward pass.
          python autonomous_ci.py \
            --skip-smoke-test \
            --no-merge \
            --max-fix-attempts 3 \
            --ai-provider auto \
            --repo "$GITHUB_REPO" \
            2>&1 | tee -a training.log
          FIX_EXIT=$?

          if [[ $FIX_EXIT -eq 0 ]]; then
            echo "local_fix_succeeded=true" >> "$GITHUB_OUTPUT"
            echo "✅ Local auto-fix succeeded — committing and pushing..."
            git config user.email "gpu-training[bot]@users.noreply.github.com"
            git config user.name "GPU Training Bot"
            git add -A
            git diff --cached --quiet || \
              git commit -m "fix: auto-fix applied by autonomous_ci.py on GPU runner [run ${{ github.run_id }}]"
            git push origin HEAD:"${{ github.ref_name }}" || true
          else
            echo "local_fix_succeeded=false" >> "$GITHUB_OUTPUT"
            echo "❌ Local auto-fix did not resolve the issue — escalating to Copilot."
          fi

      # -----------------------------------------------------------------------
      # 8. Collect recent git log for failure context
      # -----------------------------------------------------------------------
      - name: Collect failure context
        id: context_info
        if: steps.train.outcome == 'failure'
        run: |
          # Last 5 commits with changed files (URL-encode newlines for GITHUB_OUTPUT)
          RECENT_CHANGES="$(git log --oneline --name-only -5 2>/dev/null || echo 'unavailable')"
          RECENT_CHANGES_ESCAPED="${RECENT_CHANGES//$'\n'/'%0A'}"
          echo "recent_changes=$RECENT_CHANGES_ESCAPED" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 9. Update iteration counter and commit state on failure
      #    Skip if local auto-fix already resolved the issue.
      # -----------------------------------------------------------------------
      - name: Update auto-fix state (on failure)
        if: steps.train.outcome == 'failure' && steps.local_fix.outputs.local_fix_succeeded != 'true'
        run: |
          STATE_FILE=".github/auto_fix_state.json"
          python3 - <<'PYEOF'
          import json, os, datetime

          state_file = ".github/auto_fix_state.json"
          try:
              with open(state_file) as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {"iteration": 0, "max_iterations": 5, "last_failure_run_id": None,
                       "last_failure_sha": None, "history": []}

          state["iteration"] = state.get("iteration", 0) + 1
          state["last_failure_run_id"] = os.environ.get("GITHUB_RUN_ID")
          state["last_failure_sha"] = os.environ.get("GITHUB_SHA")
          if not isinstance(state.get("history"), list):
              state["history"] = []
          state["history"].append({
              "iteration": state["iteration"],
              "run_id": state["last_failure_run_id"],
              "sha": state["last_failure_sha"],
              "timestamp": datetime.datetime.utcnow().isoformat() + "Z",
          })
          # Keep history bounded to last 20 entries
          state["history"] = state["history"][-20:]

          os.makedirs(".github", exist_ok=True)
          with open(state_file, "w") as f:
              json.dump(state, f, indent=2)
          print(f"Updated iteration to {state['iteration']}")
          PYEOF

          git config user.email "gpu-training[bot]@users.noreply.github.com"
          git config user.name "GPU Training Bot"
          git add .github/auto_fix_state.json
          git diff --cached --quiet || \
            git commit -m "chore: increment auto-fix iteration to $(python3 -c "import json; print(json.load(open('.github/auto_fix_state.json'))['iteration'])")"
          git push origin HEAD:"${{ github.ref_name }}" || true

      # -----------------------------------------------------------------------
      # 10. Create GitHub Issue assigned to @copilot (on failure)
      #     If iteration >= max_iterations, escalate to human instead.
      #     Skip if local auto-fix already resolved the issue.
      # -----------------------------------------------------------------------
      - name: Create failure issue for Copilot
        if: steps.train.outcome == 'failure' && steps.local_fix.outputs.local_fix_succeeded != 'true'
        uses: actions/github-script@v8
        env:
          ITERATION: ${{ steps.state.outputs.iteration }}
          MAX_ITERATIONS: ${{ steps.state.outputs.max_iterations }}
          RECENT_CHANGES: ${{ steps.context_info.outputs.recent_changes }}
        with:
          script: |
            const fs = require('fs');

            const iteration = parseInt(process.env.ITERATION || '0', 10);
            const maxIterations = parseInt(process.env.MAX_ITERATIONS || '5', 10);
            const recentChanges = (process.env.RECENT_CHANGES || '').replace(/%0A/g, '\n');
            const nextIteration = iteration + 1;
            const atLimit = iteration >= maxIterations;

            // Read the last 4000 characters of the training log
            let logContent = '';
            try {
              const fullLog = fs.readFileSync('training.log', 'utf8');
              logContent = fullLog.length > 4000
                ? '...(truncated)...\n' + fullLog.slice(-4000)
                : fullLog;
            } catch (e) {
              logContent = `Could not read training.log: ${e.message}`;
            }

            const mode = context.payload.inputs && context.payload.inputs.training_mode
              ? context.payload.inputs.training_mode
              : 'micro';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (atLimit) {
              // Max auto-fix attempts reached — escalate to human
              const body = [
                '## 🛑 Human Intervention Required — Auto-Fix Loop Exhausted',
                '',
                `The autonomous GPU training + auto-fix loop has exhausted all **${maxIterations}** attempts without success.`,
                'No further Copilot fixes will be attempted automatically.',
                '',
                `**Commit:** ${context.sha}`,
                `**Branch:** ${context.ref.replace('refs/heads/', '')}`,
                `**Training mode:** ${mode}`,
                `**Workflow run:** [View logs](${runUrl})`,
                `**Iterations exhausted:** ${iteration}/${maxIterations}`,
                '',
                '### Tail of `training.log`',
                '```',
                logContent,
                '```',
                '',
                '### Recently changed files (last 5 commits)',
                '```',
                recentChanges,
                '```',
                '',
                '### What to do',
                '1. Review the training log above and the full workflow run logs.',
                '2. Identify the root cause — the auto-fix loop could not resolve it.',
                '3. Manually fix the issue and push a commit to main.',
                '4. Reset the auto-fix counter: edit `.github/auto_fix_state.json` and set `"iteration": 0`.',
              ].join('\n');

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[HUMAN NEEDED] GPU training auto-fix exhausted after ${iteration} attempts — ${new Date().toISOString().slice(0, 10)}`,
                body: body,
                labels: ['bug', 'training-failure', 'needs-human'],
              });
              console.log(`Created human-escalation issue #${issue.data.number}: ${issue.data.html_url}`);
            } else {
              // Normal failure — create issue for Copilot auto-fix
              const body = [
                '## GPU Training Failure — Auto-Fix Request',
                '',
                `> **Auto-fix iteration ${nextIteration} of ${maxIterations}.** This issue was created automatically by the GPU training workflow.`,
                '> When you open a PR to fix this, add the label `training-failure-fix` so the auto-merge loop (`auto_fix_loop.yml`) picks it up.',
                '> **Do NOT modify** `.github/workflows/`, `vastai_runner.sh`, or unrelated code.',
                '',
                `**Commit:** ${context.sha}`,
                `**Branch:** ${context.ref.replace('refs/heads/', '')}`,
                `**Training mode:** ${mode}`,
                `**Workflow run:** [View logs](${runUrl})`,
                `**Auto-fix iteration:** ${nextIteration}/${maxIterations}`,
                '',
                '### Tail of `training.log`',
                '```',
                logContent,
                '```',
                '',
                '### Recently changed files (last 5 commits — avoid re-breaking these)',
                '```',
                recentChanges,
                '```',
                '',
                '### Context',
                'This repo implements DONUT + TrOCR + YOLOv8 for receipt KIE (SROIE dataset).',
                '',
                '### Known failure patterns (check these first)',
                '- **F1 ≈ 0.42** → `lm_head.weight` dropped by safetensors (fix: `LmHeadCloneCallback` + `tie_word_embeddings=False`)',
                '- **F1 = 0.00** → wrong `decoder_start_token_id` (use list form: `tokenizer.convert_tokens_to_ids(["<s_sroie>"])[0]`)',
                '- **F1 ≈ 0.008** → `token2json` returned list due to `<sep/>` tokens (merge page-list in `_parse_prediction()`)',
                '- **Loss = NaN** → fp16 overflow; switch to bf16',
                '- **Import error** → run `python -c "from constants import FIELDS, BASE_MODEL, SEED"`',
                '',
                '### Validation commands',
                '```bash',
                'python diagnostics.py --smoke-test',
                'ruff check . && ruff format --check .',
                'python -c "from constants import FIELDS, BASE_MODEL, SEED"',
                '```',
                '',
                '### Instructions for fix',
                '1. Run `python run_all.py --micro --verify` locally to reproduce.',
                '2. Check `diagnostics.py --smoke-test` output for known patterns.',
                '3. Fix the root cause — do NOT modify unrelated code.',
                '4. Ensure `ruff check . && ruff format --check .` passes before pushing.',
                '5. Open a PR targeting `main` and add the label `training-failure-fix`.',
                '6. The `auto_fix_loop.yml` workflow will auto-merge if CI passes.',
              ].join('\n');

              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Auto] GPU training failure — ${new Date().toISOString().slice(0, 10)} (${mode} mode, attempt ${nextIteration}/${maxIterations})`,
                body: body,
                labels: ['bug', 'training-failure', 'training-failure-fix'],
                assignees: ['copilot'],
              });
              console.log(`Created issue #${issue.data.number}: ${issue.data.html_url}`);
            }

      # -----------------------------------------------------------------------
      # 10.5 Reset auto-fix state after successful local fix
      #      The local fix was committed and pushed in step 7.5.  The push
      #      to main will trigger a new gpu_training.yml run that re-runs
      #      training with the fix.  Reset the iteration counter so the new
      #      run starts fresh.
      # -----------------------------------------------------------------------
      - name: Reset auto-fix state after local fix (on local fix success)
        if: steps.local_fix.outputs.local_fix_succeeded == 'true'
        run: |
          python3 - <<'PYEOF'
          import json, os

          state_file = ".github/auto_fix_state.json"
          try:
              with open(state_file) as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {}
          state["iteration"] = 0
          state["max_iterations"] = state.get("max_iterations", 5)
          state["last_failure_run_id"] = None
          state["last_failure_sha"] = None
          if not isinstance(state.get("history"), list):
              state["history"] = []
          state["history"].append({
              "iteration": 0,
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "sha": os.environ.get("GITHUB_SHA"),
              "note": "Reset after successful local auto-fix",
          })
          state["history"] = state["history"][-20:]

          os.makedirs(".github", exist_ok=True)
          with open(state_file, "w") as f:
              json.dump(state, f, indent=2)
          print("Reset auto-fix iteration counter after local fix")
          PYEOF

          git config user.email "gpu-training[bot]@users.noreply.github.com"
          git config user.name "GPU Training Bot"
          git add .github/auto_fix_state.json
          git diff --cached --quiet || \
            git commit -m "chore: reset auto-fix counter after local fix [run ${{ github.run_id }}]"
          git push origin HEAD:"${{ github.ref_name }}" || true

      # -----------------------------------------------------------------------
      # 11. Commit and push result files + reset state on success
      # -----------------------------------------------------------------------
      - name: Commit results and reset auto-fix state (on success)
        if: steps.train.outcome == 'success'
        run: |
          # Reset iteration counter to 0 on success
          python3 - <<'PYEOF'
          import json, os

          state_file = ".github/auto_fix_state.json"
          try:
              with open(state_file) as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {}
          state["iteration"] = 0
          state["max_iterations"] = state.get("max_iterations", 5)
          state["last_failure_run_id"] = None
          state["last_failure_sha"] = None
          if not isinstance(state.get("history"), list):
              state["history"] = []

          os.makedirs(".github", exist_ok=True)
          with open(state_file, "w") as f:
              json.dump(state, f, indent=2)
          print("Reset auto-fix iteration counter to 0")
          PYEOF

          git config user.email "gpu-training[bot]@users.noreply.github.com"
          git config user.name "GPU Training Bot"
          git add results/ .github/auto_fix_state.json || true
          git diff --cached --quiet || \
            git commit -m "chore: training results + reset auto-fix counter [run ${GITHUB_SHA::8}]"
          git push origin HEAD:"${{ github.ref_name }}" || true

      # -----------------------------------------------------------------------
      # 12. Clean up API key files (always)
      # -----------------------------------------------------------------------
      - name: Clean up key files
        if: always()
        run: rm -f anthropic_api_key.txt mistral_api_key.txt

      # -----------------------------------------------------------------------
      # 13. Upload artifacts (always)
      # -----------------------------------------------------------------------
      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: training-results-${{ github.run_id }}
          path: |
            results/
            training.log
          if-no-files-found: ignore
          retention-days: 30
