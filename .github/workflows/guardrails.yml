name: Guardrails

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  guardrails:
    name: Training Invariants & Guardrail Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only dependencies
        run: |
          pip install --upgrade pip
          pip install pytest
          # Install torch CPU-only (no CUDA needed for logic tests)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install remaining project deps that are importable on CPU
          pip install transformers sentencepiece psutil Pillow editdistance

      - name: Run resource optimizer guardrail tests
        run: pytest tests/test_resource_optimizer.py -v --tb=short

      - name: Run training invariant tests
        run: pytest tests/test_train_invariants.py -v --tb=short -k "not TestDecoderStartTokenId"
        # DecoderStartTokenId tests require donut model download — skip in CI
        # but they run locally where the model is cached.

      - name: Run existing metric tests
        run: pytest tests/test_metrics.py tests/test_constants.py tests/test_pipeline_smoke.py -v --tb=short
