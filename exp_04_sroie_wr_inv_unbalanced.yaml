# ============================================================
# Experiment 4 — SROIE + WildReceipt + Invoices (no oversampling)
# Tests all three datasets at natural ratio.
#
# Actual result (2026-03-07):
#   global_f1=0.8224  — combined unbalanced still below baseline
#   Expected total samples: ~1,718
# ============================================================

experiment_id: 4
name: "sroie_wildreceipt_invoices_unbalanced"
description: >
  All three datasets combined at natural ratio — no oversampling of SROIE.
  The combined unbalanced mix still scores below the SROIE-only baseline (0.8503)
  at F1=0.8224. Demonstrates that raw data volume does not help without
  domain rebalancing. See Exp 7 for the corrected 2× oversample version.

model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

data:
  image_height: 1280
  image_width: 960
  max_decode_length: 768
  image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]

datasets:
  - name: sroie
    split: train
    oversample: 1              # 500 samples
  - name: wildreceipt
    split: train
    oversample: 1              # ~886 samples
  - name: invoices_donut
    split: train
    oversample: 1              # ~332 samples
  # Expected total: ~1,718

training:
  epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: fp16

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

validation:
  enabled: true
  precompute_tensors: false

output:
  results_file: "results/experiment_4.json"
  checkpoint_dir: "models/donut_exp4/"
  log_file: "logs/experiment_4.log"

hardware:
  min_vram_gb: 16
  recommended_vram_gb: 40
  estimated_training_time:
    RTX_6000_Blackwell_96GB: "~50 min"
    A100_80GB: "~30 min"
    RTX_4090_24GB: "~75 min"
