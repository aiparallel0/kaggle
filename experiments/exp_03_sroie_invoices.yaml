# ============================================================
# Experiment 3 — SROIE + Invoices-DONUT (no oversampling)
# Tests cross-domain invoice data without rebalancing.
#
# Actual result (2026-03-07):
#   global_f1=0.2867  — severe regression from cross-domain shift
#   "Cross-domain hurts severely without rebalancing"
#   Expected total samples: ~832
# ============================================================

experiment_id: 3
name: "sroie_plus_invoices"
description: >
  SROIE + Invoices-DONUT combined at natural ratio (no oversampling).
  Invoices are a different domain from receipts; without SROIE oversampling
  to anchor the model, the cross-domain signal dominates and F1 collapses
  from 0.8503 (Exp 1) to 0.2867. See Exp 6 for the corrected version
  with 2× SROIE oversampling.

model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

data:
  image_height: 1280
  image_width: 960
  max_decode_length: 768
  image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]

datasets:
  - name: sroie
    split: train
    oversample: 1              # 500 samples — no oversampling
  - name: invoices_donut
    split: train
    oversample: 1              # ~332 samples (katanaml-org/invoices-donut-data-v1)
  # Expected total: ~832

training:
  epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: fp16

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

validation:
  enabled: true
  precompute_tensors: false

output:
  results_file: "results/experiment_3.json"
  checkpoint_dir: "models/donut_exp3/"
  log_file: "logs/experiment_3.log"

hardware:
  min_vram_gb: 16
  recommended_vram_gb: 40
  estimated_training_time:
    RTX_6000_Blackwell_96GB: "~25 min"
    A100_80GB: "~15 min"
    RTX_4090_24GB: "~40 min"
