# ============================================================
# DAG Dependency Example — Experiment 5 (depends on Exp 1 baseline)
#
# This YAML illustrates the `depends_on` field used by dag_scheduler.py
# when --parallel is enabled.
#
# depends_on: [1]  means this experiment waits for Experiment 1 to
# complete before starting.  On a multi-GPU setup, experiments without
# unmet dependencies run concurrently.
# ============================================================

experiment_id: 5
name: "sroie_2x_wildreceipt_dag_example"
description: >
  Example: SROIE + WildReceipt with 2× SROIE oversampling.
  Demonstrates depends_on: this experiment waits for the baseline (exp 1)
  so we can compare results side-by-side.

# DAG dependency — wait for the baseline experiment to complete first.
# Remove or leave empty to allow parallel execution with no prerequisite.
depends_on: [1]

# ------------------------------------------------------------------
# MODEL
# ------------------------------------------------------------------
model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true
  image_height: 1280
  image_width: 960
  max_length: 768
  arch_type: donut

# ------------------------------------------------------------------
# DATA
# ------------------------------------------------------------------
datasets:
  - name: sroie
    split: train
    oversample: 2
  - name: wildreceipt
    split: train
    oversample: 1

# ------------------------------------------------------------------
# TRAINING
# ------------------------------------------------------------------
training:
  epochs: 15
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: fp16

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 40

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

# ------------------------------------------------------------------
# VALIDATION
# ------------------------------------------------------------------
validation:
  precompute_tensors: false

# ------------------------------------------------------------------
# OUTPUT
# ------------------------------------------------------------------
output:
  results_file: "results/experiment_5.json"
  checkpoint_dir: "models/donut_exp5/"
  log_file: "logs/experiment_5.log"
