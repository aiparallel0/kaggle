# ============================================================
# DAG Dependency Example — Experiment 100
# (Template demonstrating the depends_on field — not a production experiment)
#
# This YAML illustrates the `depends_on` field used by dag_scheduler.py
# when --parallel is enabled.
#
# depends_on: [1]  means this experiment waits for Experiment 1 to
# complete before starting.  On a multi-GPU setup, experiments without
# unmet dependencies run concurrently.
#
# NOTE: experiment_id: 100 is intentionally outside the 1–18 production
# range so this template does not conflict with any real experiment.
# ============================================================

experiment_id: 100
name: "dag_example_sroie_2x_wildreceipt"
description: >
  Template: SROIE + WildReceipt with 2× SROIE oversampling.
  Demonstrates depends_on: this experiment waits for the baseline (exp 1)
  so we can compare results side-by-side.
  This is a documentation template — use exp_05_sroie_2x_wildreceipt.yaml
  for the production Experiment 5 config.

# DAG dependency — wait for the baseline experiment to complete first.
# Remove or leave empty to allow parallel execution with no prerequisite.
depends_on: [1]

# ------------------------------------------------------------------
# ARCH
# ------------------------------------------------------------------
arch:
  type: donut

# ------------------------------------------------------------------
# MODEL
# ------------------------------------------------------------------
model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

# ------------------------------------------------------------------
# DATA
# ------------------------------------------------------------------
data:
  image_height: 1280
  image_width: 960
  max_decode_length: 768

datasets:
  - name: sroie
    split: train
    oversample: 2
  - name: wildreceipt
    split: train
    oversample: 1

# ------------------------------------------------------------------
# TRAINING
# ------------------------------------------------------------------
training:
  epochs: 15
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: fp16

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 40

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

# ------------------------------------------------------------------
# VALIDATION
# ------------------------------------------------------------------
validation:
  precompute_tensors: false

# ------------------------------------------------------------------
# OUTPUT
# ------------------------------------------------------------------
output:
  results_file: "results/experiment_100.json"
  checkpoint_dir: "models/donut_exp100/"
  log_file: "logs/experiment_100.log"
