# ============================================================
# Experiment 6 — SROIE (2× oversample) + Invoices-DONUT  ★ BEST ★
# The best-performing configuration in the study.
#
# Actual result (2026-03-07, RTX 6000 Blackwell 96 GB):
#   global_f1 = 0.8982  ← BEST
#   company   = 0.9048   date    = 0.9841
#   address   = 0.7903   total   = 0.9120
#   exact_match = 0.6667
#   Early stopped at epoch 8, training_time_sec=2374 (~39.6 min)
#
#   Gain vs Exp 1 (SROIE baseline 0.8503): +0.0479
#   Gain vs published DONUT baseline 0.8411: +0.0571
#   Expected total samples: ~1,332 (1000 SROIE + 332 Invoices)
# ============================================================

experiment_id: 6
name: "sroie_2x_plus_invoices_BEST"
description: >
  SROIE oversampled 2× (1000 samples) combined with Invoices-DONUT (332 samples).
  The 2× SROIE oversampling anchors the model firmly to the SROIE receipt domain,
  while Invoices-DONUT provides structured field layout knowledge that generalises
  company/total extraction. This combination achieves the best global F1 of 0.8982,
  a +5.71pp gain over the published DONUT baseline.
  Early stopping triggered at epoch 8 — the model converged faster with this mix.

model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

data:
  image_height: 1280
  image_width: 960
  max_decode_length: 768
  image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]

datasets:
  - name: sroie
    split: train
    oversample: 2              # 500 × 2 = 1000 samples  ← KEY: 2× anchoring
  - name: invoices_donut
    split: train
    oversample: 1              # ~332 samples (katanaml-org/invoices-donut-data-v1)
  # Expected total: ~1,332

training:
  epochs: 15                   # Early stopped at epoch 8 in reference run
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: fp16

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

validation:
  enabled: true
  precompute_tensors: false    # CRITICAL: val_ds must never precompute tensors

output:
  results_file: "results/experiment_6.json"
  checkpoint_dir: "models/donut_exp6/"
  log_file: "logs/experiment_6.log"

hardware:
  min_vram_gb: 16
  recommended_vram_gb: 40
  estimated_training_time:
    RTX_6000_Blackwell_96GB: "~39.6 min (measured)"
    A100_80GB: "~25 min"
    RTX_4090_24GB: "~60 min"
