# ============================================================
# Experiment 7 — SROIE (2× oversample) + WildReceipt + Invoices
# Tests whether using all three datasets with SROIE anchoring
# beats Exp 6 (SROIE + Invoices only).
#
# Actual result (2026-03-07):
#   global_f1=0.8503  training_time_sec=5061 (~84 min)
#   Matches baseline only — competing signals cancel each other
#   Expected total samples: ~2,218 (1000 SROIE + 886 WR + 332 Inv)
# ============================================================

experiment_id: 7
name: "sroie_2x_all_datasets"
description: >
  SROIE oversampled 2× combined with both WildReceipt and Invoices-DONUT.
  Despite more data and SROIE anchoring, F1 drops back to baseline (0.8503)
  because WildReceipt and Invoices send conflicting generalisation signals
  that cancel each other's benefit. Exp 6 (without WildReceipt) is strictly
  better. This is the longest-running successful experiment (~84 min).

model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

data:
  image_height: 1280
  image_width: 960
  max_decode_length: 768
  image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]

datasets:
  - name: sroie
    split: train
    oversample: 2              # 500 × 2 = 1000 samples
  - name: wildreceipt
    split: train
    oversample: 1              # ~886 samples
  - name: invoices_donut
    split: train
    oversample: 1              # ~332 samples
  # Expected total: ~2,218

training:
  epochs: 15
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: fp16

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

validation:
  enabled: true
  precompute_tensors: false

output:
  results_file: "results/experiment_7.json"
  checkpoint_dir: "models/donut_exp7/"
  log_file: "logs/experiment_7.log"

hardware:
  min_vram_gb: 16
  recommended_vram_gb: 40
  estimated_training_time:
    RTX_6000_Blackwell_96GB: "~84 min (measured)"
    A100_80GB: "~50 min"
    RTX_4090_24GB: "~120 min"
