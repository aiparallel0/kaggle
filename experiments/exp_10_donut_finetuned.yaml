# ============================================================
# Experiment 10 — Donut Fine-Tuned (best data recipe)
# Replicates Experiment 6 (BEST) as the fine-tuned reference
# point for the architecture comparison series (9→10→11→12).
# Using the best-known data recipe ensures Exp 10 vs 12 is a
# fair architecture comparison, not a data recipe comparison.
#
# Expected result (mirrors Exp 6, measured 2026-03-07):
#   global_f1 ≈ 0.8982
#   company=0.9048  date=0.9841  address=0.7903  total=0.9120
#
# Parameter count: ~200M (identical to Exp 9)
# ============================================================

experiment_id: 10
name: "donut_finetuned_best_recipe"
description: >
  donut-base fully fine-tuned with the best-performing multi-dataset
  recipe from the core study (SROIE x2 + Invoices-DONUT, replicating
  Exp 6). Serves as the fine-tuned Donut bar in the architecture
  comparison. If Exp 6 checkpoint exists, set arch.load_checkpoint
  to skip retraining.

arch:
  type: donut
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true
  parameter_count_verified: "~200M (Swin-B encoder ~88M + mBART decoder ~112M)"

model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

data:
  image_height: 1280
  image_width: 960
  max_decode_length: 768
  image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]

datasets:
  - name: sroie
    split: train
    oversample: 2
  - name: invoices_donut
    split: train
    oversample: 1

training:
  is_zero_shot: false
  skip: false
  epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: fp16

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

validation:
  enabled: true
  precompute_tensors: false

output:
  results_file: "results/experiment_10.json"
  checkpoint_dir: "models/donut_exp10/"
  log_file: "logs/experiment_10.log"

hardware:
  min_vram_gb: 16
  recommended_vram_gb: 40
  estimated_training_time:
    RTX_6000_Blackwell_96GB: "~40 min"
    A100_80GB: "~25 min"
    RTX_4090_24GB: "~60 min"
