# ============================================================
# Experiment 11 — Donut Fine-Tuned with bf16 Mixed Precision
# Identical to Exp 10 in every way EXCEPT mixed_precision:
# changed from fp16 to bf16.
#
# Scientific question: does fp16's narrower numeric range
# limit Exp 10's F1? bf16 has fp32-equivalent range at the
# same memory and speed cost as fp16 on Blackwell/A100.
#
# One variable changed: mixed_precision fp16 → bf16.
# Everything else (data, LR, batch, seed) is identical to Exp 10.
#
# NOTE: bf16 requires Ampere or newer GPU (A100, RTX 30xx+,
# RTX 6000 Blackwell). Falls back to fp32 on older hardware.
#
# Parameter count: ~200M (identical to Exps 9 and 10)
# ============================================================

experiment_id: 11
name: "donut_finetuned_bf16"
description: >
  Identical to Exp 10 (fine-tuned donut-base, SROIE x2 + Invoices)
  but with mixed_precision changed from fp16 to bf16. Tests whether
  fp16 numeric overflow was a limiting factor in Exp 10's training.
  bf16 provides the same memory/speed profile as fp16 but with
  fp32-equivalent numeric range, eliminating overflow risk.
  One variable isolates the effect cleanly.

arch:
  type: donut
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true
  parameter_count_verified: "~200M — identical to Exp 10. bf16 does not change parameter count."

model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

data:
  image_height: 1280
  image_width: 960
  max_decode_length: 768
  image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]

datasets:
  - name: sroie
    split: train
    oversample: 2
  - name: invoices_donut
    split: train
    oversample: 1

training:
  is_zero_shot: false
  skip: false
  epochs: 10
  batch_size: 8
  gradient_accumulation_steps: 2
  mixed_precision: bf16        # ← ONLY CHANGE vs Exp 10

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

validation:
  enabled: true
  precompute_tensors: false

output:
  results_file: "results/experiment_11.json"
  checkpoint_dir: "models/donut_exp11/"
  log_file: "logs/experiment_11.log"

hardware:
  min_vram_gb: 16
  recommended_vram_gb: 40
  bf16_requirement: "Ampere or newer GPU required (A100, RTX 30xx+, RTX 6000 Blackwell). Falls back to fp32 on older hardware."
  estimated_training_time:
    RTX_6000_Blackwell_96GB: "~38 min (similar to Exp 10)"
    A100_80GB: "~23 min"
    RTX_4090_24GB: "~58 min"
