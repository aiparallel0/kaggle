# ============================================================
# Experiment 15 — TrOCR + YOLOv8x + Regex Pipeline
# Two-stage pipeline: YOLO detects field regions -> TrOCR reads
# crops -> regex post-processing normalises field values.
# Uses SROIE-only training data for minimal/fastest baseline.
#
# Architecture type: PIPELINE (not end-to-end).
# Entry point: train_trocr_yolo.py
#
# PARAMETER COUNT (verified):
#   TrOCR-base-printed: ~211M (ViT-B ~86M + RoBERTa-B ~125M)
#   YOLOv8x: ~68M
#   Pipeline total: ~279M
# ============================================================
experiment_id: 15
name: "trocr_yolo_regex_pipeline_sroie_only"
description: >
  TrOCR+YOLO two-stage pipeline with SROIE-only training data.
  Minimal/fastest configuration for architecture comparison baseline.
  Stage 1: YOLOv8x detects field regions. Stage 2: TrOCR-base reads crops.
  Stage 3: Regex normalises output. Contrasts with Donut end-to-end approach.

arch:
  type: trocr_yolo
  trocr:
    base_checkpoint: "microsoft/trocr-base-printed"
    parameter_count: "~211M"
    full_parameter_finetuning: true
    max_new_tokens: 128
  yolo:
    base_checkpoint: "yolov8x.pt"
    parameter_count: "~68M"
    num_classes: 4
    full_parameter_finetuning: true
    input_size: 1280
  regex:
    enabled: true
    validate_on_train_split: true
    fail_on_coverage_below: 0.95

model:
  base_checkpoint: "microsoft/trocr-base-printed"
  tie_word_embeddings: false
  full_parameter_finetuning: true

data:
  image_height: 1280
  image_width: 960
  max_decode_length: 128
  image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]
  yolo_input_size: 1280
  trocr_crop_height: 64
  trocr_crop_width: 384

datasets:
  - name: sroie
    split: train
    oversample: 1                    # SROIE only, no oversampling — minimal config

training:
  is_zero_shot: false
  skip: false
  seed: 42

  yolo_stage:
    epochs: 50
    batch_size: 16
    imgsz: 1280
    optimizer: SGD
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    warmup_epochs: 3.0
    patience: 10
    mixed_precision: true

  trocr_stage:
    epochs: 10
    batch_size: 32
    gradient_accumulation_steps: 1
    mixed_precision: fp16
    optimizer:
      type: AdamW
      weight_decay: 0.01
      lr: 5.0e-5
    scheduler:
      type: cosine
      warmup_steps: 200
    early_stopping:
      enabled: true
      patience: 3
      monitor: val_cer

  epochs: 10
  batch_size: 32
  gradient_accumulation_steps: 1
  mixed_precision: fp16

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 5.0e-5

  scheduler:
    type: cosine
    warmup_steps: 200

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

validation:
  enabled: true
  precompute_tensors: false

output:
  results_file: "results/experiment_15.json"
  checkpoint_dir: "models/trocr_yolo_exp15/"
  log_file: "logs/experiment_15.log"

hardware:
  min_vram_gb: 16
  recommended_vram_gb: 40
  estimated_training_time:
    RTX_6000_Blackwell_96GB: "~20 min YOLO + ~10 min TrOCR = ~30 min total"
    A100_80GB: "~12 min YOLO + ~7 min TrOCR = ~19 min total"
    RTX_4090_24GB: "~35 min YOLO + ~15 min TrOCR = ~50 min total"
