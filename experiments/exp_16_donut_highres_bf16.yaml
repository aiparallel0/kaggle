# ============================================================
# Experiment 16 — Donut Fine-Tuned, 2560x1920 Resolution, bf16
# Same as Exp 14 (high-res fp16) but with bf16 precision.
# Isolates whether bf16's wider numeric range helps at high res
# where fp16 overflow risk is elevated (larger activations).
#
# allow_high_res: true required — same as Exp 14.
# resource_optimizer patches batch_size/grad_accum at runtime.
#
# Parameter count: ~200M
# ============================================================
experiment_id: 16
name: "donut_highres_bf16"
description: >
  donut-base fine-tuned at 2560x1920 resolution with bf16 precision.
  Same data recipe as Exps 10-14. Only variable vs Exp 14: bf16 instead
  of fp16. Tests whether bf16 stability at high resolution improves
  F1 over Exp 14. bf16 required on Ampere+ GPU.

arch:
  type: donut
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

model:
  base_checkpoint: "naver-clova-ix/donut-base"
  tie_word_embeddings: false
  full_parameter_finetuning: true

data:
  image_height: 2560
  image_width: 1920
  allow_high_res: true
  max_decode_length: 768
  image_formats: [".jpg", ".jpeg", ".png", ".bmp", ".tiff"]
  processor_config_note: >
    processor_config.json MUST have max_size.height=2560, max_size.width=1920.
    Revert to height=1280, width=960 after this experiment.

datasets:
  - name: sroie
    split: train
    oversample: 2
  - name: invoices_donut
    split: train
    oversample: 1

training:
  is_zero_shot: false
  skip: false
  epochs: 10
  batch_size: 2
  gradient_accumulation_steps: 8
  resource_optimizer_target_effective_batch: 16
  mixed_precision: bf16              # ← ONLY CHANGE vs Exp 14

  optimizer:
    type: AdamW
    weight_decay: 0.01
    encoder_lr: 5.0e-5
    decoder_lr: 1.0e-4

  scheduler:
    type: cosine
    warmup_steps: 500

  early_stopping:
    enabled: true
    patience: 3
    monitor: val_loss

  seed: 42

validation:
  enabled: true
  precompute_tensors: false

output:
  results_file: "results/experiment_16.json"
  checkpoint_dir: "models/donut_exp16/"
  log_file: "logs/experiment_16.log"

hardware:
  min_vram_gb: 40
  recommended_vram_gb: 80
  bf16_requirement: "Ampere or newer GPU required."
  estimated_training_time:
    RTX_6000_Blackwell_96GB: "~155 min"
    A100_80GB: "~95 min"
    RTX_4090_24GB: "likely OOM"
  preflight_checklist:
    - "Set processor_config.json: max_size.height=2560, max_size.width=1920"
    - "After experiment: REVERT processor_config.json to height=1280, width=960"
