[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Ensure pipeline_types/ and validators/ sub-packages are included when the
# project is installed with `pip install -e .`, making them importable regardless
# of the working directory.
where = ["."]
include = ["pipeline_types*", "validators*"]

[project]
name = "donut-kiedata"
version = "1.0.0"
description = "DONUT + TrOCR + YOLO multi-dataset KIE pipeline for receipt understanding"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
keywords = ["donut", "transformers", "ocr", "kie", "receipts", "yolo", "trocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
donut-kie = "run_all:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "B905",   # zip without strict (Python 3.10+ only)
    "SIM108", # ternary operator (readability preference)
    "SIM105", # contextlib.suppress (readability preference)
    "UP015",  # open mode "r" (explicit is fine)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
