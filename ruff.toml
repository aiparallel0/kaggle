# ruff.toml — linter/formatter config (moved from pyproject.toml)
target-version = "py310"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name
    "B905",   # zip without strict (Python 3.10+ only)
    "SIM108", # ternary operator (readability preference)
    "SIM105", # contextlib.suppress (readability preference)
    "UP015",  # open mode "r" (explicit is fine)
]

[format]
quote-style = "double"
